<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>نوید حسینی | توسعه‌دهنده فول‌استک</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#222;--card:#111}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.container{max-width:720px;margin:0 auto;padding:2rem 1.25rem}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem}h1{font-size:2.5rem;margin-bottom:0.5rem}.skills{display:flex;flex-wrap:wrap;gap:0.5rem;margin:1.5rem 0}.skill{background:var(--card);border:1px solid var(--border);padding:0.4rem 0.8rem;border-radius:20px;font-size:0.9rem}button.theme{background:none;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer}button.cta{background:var(--accent);color:var(--bg);border:none;padding:0.9rem 1.5rem;border-radius:8px;cursor:pointer;font-weight:600}</style>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"></head>
<body><div class="container"><header><div>نوید حسینی</div><button class="theme" onclick="toggleTheme()">تم</button></header><h1>توسعه‌دهنده فول‌استک</h1><p style="color:var(--muted);margin-bottom:2rem">ساخت اپلیکیشن‌های وب قابل اعتماد با TypeScript، React و Node.js. تمرکز بر سادگی و کیفیت.</p><div class="skills"><span class="skill">React</span><span class="skill">TypeScript</span><span class="skill">Node.js</span><span class="skill">PostgreSQL</span><span class="skill">Tailwind</span></div><h3>پروژه‌های منتخب</h3><ul style="margin:1rem 0 2rem;padding-right:1.2rem"><li>داشبورد مدیریت پروژه</li><li>اپ موبایل سلامت</li></ul><button class="cta">تماس / دانلود رزومه</button></div>
<script>function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme')||'light';h.setAttribute('data-theme',c==='light'?'dark':'light');localStorage.setItem('theme',h.getAttribute('data-theme'));}if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script></body></html>
